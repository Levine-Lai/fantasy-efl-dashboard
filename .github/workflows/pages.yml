name: Update Fantasy EFL Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: public/chart-assets
          key: ${{ runner.os }}-chart-thumbs-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-chart-thumbs-v2-
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/player-advanced.json
          key: ${{ runner.os }}-advanced-player-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-advanced-player-v2-
      - run: node scripts/test-round-selection.mjs
      - run: node league-standings/verify.mjs
      - run: npm run build
      - run: node scripts/test-chart-data.mjs
      - run: node scripts/test-chart-history.mjs
      - run: node scripts/test-attacking-data.mjs
      - run: node scripts/test-dashboard-features.mjs
      - run: node scripts/test-personal-data.mjs
      - run: node scripts/test-round-views.mjs
      - run: node scripts/test-fixture-difficulty.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
